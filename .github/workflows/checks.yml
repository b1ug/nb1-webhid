name: Browser tools checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - run: npm run build
      - run: npm test
      - run: npm run test:compiler
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: nb1-browser-node-${{ matrix.node }}
          path: dist/
